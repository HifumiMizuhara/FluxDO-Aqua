name: Native SVG Static Check

on:
  push:
    branches:
      - perf/native-svg-signature-pipeline
    paths:
      - lib/widgets/content/animated_svg_view.dart
      - lib/widgets/content/signature_svg_player.dart
      - lib/services/signature_frame_scheduler.dart
      - .github/workflows/native-svg-static-check.yaml

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze native SVG changes
        run: >-
          flutter analyze
          lib/widgets/content/animated_svg_view.dart
          lib/widgets/content/signature_svg_player.dart
          lib/services/signature_frame_scheduler.dart
