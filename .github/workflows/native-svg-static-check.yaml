name: Native SVG Static Check

on:
  push:
    branches:
      - perf/native-svg-signature-pipeline
    paths:
      - lib/widgets/content/animated_svg_view.dart
      - lib/widgets/content/signature_svg_player.dart
      - lib/services/signature_frame_scheduler.dart
      - .github/workflows/native-svg-static-check.yaml

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # Superproject が指す fluxdo_render commit は upstream から消えているため、
      # static check では現行 upstream を配置して workspace 解決だけ行う。
      - name: Restore fluxdo_render workspace package
        run: |
          rm -rf packages/fluxdo_render
          git clone --depth 1 https://github.com/Lingyan000/fluxdo_render.git packages/fluxdo_render
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze native SVG changes
        run: >-
          flutter analyze
          lib/widgets/content/animated_svg_view.dart
          lib/widgets/content/signature_svg_player.dart
          lib/services/signature_frame_scheduler.dart
